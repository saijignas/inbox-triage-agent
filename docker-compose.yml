# Local stack: Postgres + backend + frontend.
#   cp .env.example .env   (set JWT_SECRET; GEMINI_API_KEY is optional)
#   docker compose up --build
# Frontend: http://localhost:3000   API docs: http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-triage}   # local-dev default; change for anything shared
      POSTGRES_DB: triage
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d triage"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        WITH_GEMINI: ${WITH_GEMINI:-0}
    environment:
      APP_ENV: prod
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DATABASE_URL: postgresql+psycopg://triage:${POSTGRES_PASSWORD:-triage}@db:5432/triage
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
